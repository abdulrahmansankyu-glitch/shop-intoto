# One-click deploy for Intoto ERP.
#
#   https://dashboard.render.com/blueprints → New Blueprint Instance
#
# Deliberately NOT Docker. Two attempts at Docker images failed on the seams between
# pnpm's symlinked node_modules and the image build. Render's native Node runtime runs
# the same commands the project already uses in development, so there is far less between
# the source and a running process — and any failure names the actual command that broke.
#
# Free tier, with two limits worth knowing before you rely on it:
#   * Services sleep after 15 minutes idle and take ~50s to wake.
#   * The free database is REMOVED AFTER 30 DAYS. Fine for trying the system out;
#     before you bill real customers, move to a paid database or to Neon's free tier
#     (which persists) — see DEPLOYMENT.md.

databases:
  - name: intoto-db
    databaseName: intoto_erp
    user: intoto
    plan: free
    region: singapore # closest Render region to India

services:
  # ---------------- Backend ----------------
  - type: web
    name: intoto-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    healthCheckPath: /api/v1/health

    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @intoto/shared build &&
      pnpm --filter @intoto/api exec prisma generate &&
      pnpm --filter @intoto/api build

    # Migrations run before the server accepts traffic, so the process never serves
    # against a schema it does not match. The seed only fills an empty database, so a
    # fresh deployment is usable on arrival instead of showing a login screen with no
    # accounts — and a restart never disturbs real data.
    startCommand: sh infra/render/start-api.sh

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intoto-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      # Generated once and kept stable across deploys. Changing either signs everyone out.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Encrypts supplier bank details at rest.
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: intoto-web
          property: host
      - key: DEFAULT_STATE_CODE
        value: "09"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: STORAGE_DRIVER
        value: local
      - key: AI_ENABLED
        value: false
      - key: RUN_SEED_ON_BOOT
        value: "true"

  # ---------------- Screens ----------------
  - type: web
    name: intoto-web
    runtime: node
    plan: free
    region: singapore
    rootDir: .

    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @intoto/shared build &&
      pnpm --filter @intoto/web build

    # Bound to 0.0.0.0 — the default localhost bind makes the service unreachable from
    # outside, which looks identical to a crash.
    startCommand: cd apps/web && ./node_modules/.bin/next start -H 0.0.0.0 -p $PORT

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The browser calls this server's own origin and Next proxies through to the API.
      # Next bakes NEXT_PUBLIC_* into the bundle at build time, so it cannot be handed an
      # address that only exists once the host assigns one; the proxy keeps the backend
      # address a runtime value, and removes cross-origin requests entirely.
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: intoto-api
          property: host
      - key: NEXT_PUBLIC_APP_NAME
        value: Intoto ERP
      # Opens the app without a login screen, using the seeded owner account.
      #
      # This puts a working password into the browser bundle, so it is safe only while the
      # database holds nothing but seed data. SET THIS TO false BEFORE ENTERING REAL SALES,
      # then redeploy — the normal sign-in form is always there underneath.
      - key: NEXT_PUBLIC_DEMO_LOGIN
        value: "true"

  # ------------- Engineering Activity Tracker -------------
  #
  # A separate service with its own URL — this is the link the engineering team gets.
  # It shares the database above but keeps its tables in a `tracker` schema, out of
  # reach of the ERP's `prisma db push`, which drops tables in `public` that its own
  # schema does not declare.
  #
  # One process serves both the API and the browser app, so there is no second host
  # to configure and no cross-origin setup to get wrong.
  - type: web
    name: intoto-tracker
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    healthCheckPath: /api/health

    # No build step: the tracker is plain JavaScript on both sides. Only its own
    # dependencies are installed, so this deploys in a fraction of the API's time.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --filter @intoto/tracker

    startCommand: node apps/tracker/src/server.js

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intoto-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The shared code the team types once, on first visit. Render asks for a value
      # when you create the blueprint. Leave it empty ONLY if the URL itself is
      # private — with no code, anyone holding the link can read and edit the data.
      - key: TRACKER_ACCESS_CODE
        sync: false

      # The team's clock, so "due today" means today on the plant rather than in
      # UTC. Without it a reminder run just after midnight local time would be
      # working from yesterday's date.
      - key: TZ
        value: Asia/Riyadh

      # --- Daily email reminders -------------------------------------------
      #
      # All optional: with none of them set the app runs exactly as before and
      # the Settings screen says what is missing.
      #
      # The shared secret the scheduler presents to trigger a run. Unset means
      # no schedule — better than a trigger anyone who finds the URL can pull.
      - key: TRACKER_REMINDER_SECRET
        sync: false
      # Who the reminders come from. With Microsoft Graph this must be a real
      # mailbox, e.g. "Engineering Tracker <engineering@company.com>".
      - key: TRACKER_MAIL_FROM
        sync: false

      # One transport.
      #
      # For a company Microsoft 365 / Outlook mailbox, use Graph — Microsoft has
      # been retiring Basic auth for SMTP in Exchange Online, and a mailbox with
      # MFA generally cannot authenticate over SMTP at all. These three come from
      # an Entra ID app registration with the Mail.Send *application* permission.
      - key: TRACKER_GRAPH_TENANT_ID
        sync: false
      - key: TRACKER_GRAPH_CLIENT_ID
        sync: false
      - key: TRACKER_GRAPH_CLIENT_SECRET
        sync: false

      # Or plain SMTP. For Gmail: smtp.gmail.com, port 587, and an *app
      # password* — a Google account password will be refused.
      - key: TRACKER_SMTP_HOST
        sync: false
      - key: TRACKER_SMTP_PORT
        sync: false
      - key: TRACKER_SMTP_USER
        sync: false
      - key: TRACKER_SMTP_PASSWORD
        sync: false

      # --- WhatsApp reminders ----------------------------------------------
      #
      # None of these are needed to use WhatsApp. Without them the app runs in
      # its free mode: it writes each person's message and gives an admin a link
      # per person to tap and send. That costs nothing and needs no approval.
      #
      # They are only for sending unattended, which WhatsApp charges for. Meta's
      # Cloud API needs a WhatsApp Business number, and a message the business
      # starts must use a template approved in advance — TRACKER_WHATSAPP_TEMPLATE
      # is that template's name, and without it a scheduled message is refused.
      - key: TRACKER_WHATSAPP_TOKEN
        sync: false
      - key: TRACKER_WHATSAPP_PHONE_ID
        sync: false
      - key: TRACKER_WHATSAPP_TEMPLATE
        sync: false

      # Or Twilio, whose sandbox number is the easiest way to prove the plumbing
      # before a company number exists. Each person opts in by messaging it once,
      # and that opt-in lapses after 72 hours.
      - key: TRACKER_TWILIO_SID
        sync: false
      - key: TRACKER_TWILIO_TOKEN
        sync: false
      - key: TRACKER_TWILIO_FROM
        sync: false

      # The country code assumed when somebody types a number the local way
      # ("0551234567"). 966 is Saudi Arabia.
      - key: TRACKER_WHATSAPP_COUNTRY
        value: "966"
